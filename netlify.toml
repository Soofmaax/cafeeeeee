[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # These three values are intentionally exposed to the browser by their
  # providers. Keep Netlify's scan enabled for every actual server secret.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"
